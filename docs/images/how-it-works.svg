<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="How it works: the script installs llama.cpp from its official releases, downloads the model from IFM on Hugging Face, verifies it, and runs it on your computer">
  <rect width="1200" height="560" fill="#FFFFFF"/>
  <g font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <text x="48" y="52" font-size="15" fill="#141414">K2 Horizon</text>
  <text x="48" y="112" font-size="40" fill="#141414"><tspan font-weight="800" fill="#E25727">How it works:</tspan> from official sources to your computer</text>
  <rect x="48" y="138" width="1104" height="4" fill="#E25727"/>
    <g font-size="15" fill="#6B6B6B"><text x="64" y="184">Step</text><text x="160" y="184">What happens</text><text x="856" y="184">Source</text></g>
    <rect x="48" y="198" width="1104" height="1.5" fill="#525252"/>
    <text x="64" y="244" font-size="19" font-weight="800" fill="#E25727">01</text>
    <text x="160" y="244" font-size="19" fill="#141414"><tspan font-weight="800">This repository</tspan> · k2local.py + SKILL.md, about 50 KB of Python</text>
    <text x="856" y="244" font-size="19" fill="#141414">Included</text>
    <rect x="48" y="266" width="1104" height="1" fill="#E6E6E6"/>
    <text x="64" y="302" font-size="19" font-weight="800" fill="#E25727">02</text>
    <text x="160" y="302" font-size="19" fill="#141414"><tspan font-weight="800">Install</tspan> · llama.cpp (build b11619), the program that runs the model</text>
    <text x="856" y="302" font-size="16" fill="#141414" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">github.com/ggml-org/llama.cpp</text>
    <rect x="48" y="324" width="1104" height="1" fill="#E6E6E6"/>
    <text x="64" y="360" font-size="19" font-weight="800" fill="#E25727">03</text>
    <text x="160" y="360" font-size="19" fill="#141414"><tspan font-weight="800">Download</tspan> · K2 Horizon GGUF, checked against IFM's checksum ✓</text>
    <text x="856" y="360" font-size="16" fill="#141414" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">huggingface.co/IFM</text>
    <rect x="48" y="382" width="1104" height="1" fill="#E6E6E6"/>
    <text x="64" y="418" font-size="19" font-weight="800" fill="#E25727">04</text>
    <text x="160" y="418" font-size="19" fill="#141414"><tspan font-weight="800">Serve</tspan> · The model runs on your computer. Nothing leaves the device</text>
    <text x="856" y="418" font-size="16" fill="#141414" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">127.0.0.1:8080/v1</text>
    <rect x="48" y="440" width="1104" height="1" fill="#E6E6E6"/>
    <rect x="48" y="466" width="1104" height="70" fill="#FBF2EB"/>
    <text x="72" y="494" font-size="13" letter-spacing="1.5" fill="#E25727">NOTHING FORKED OR BUNDLED</text>
    <text x="72" y="520" font-size="17" font-weight="800" fill="#141414">The script downloads the original files from their official sources and verifies them.</text>
  </g>
</svg>
