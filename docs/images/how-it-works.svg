<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="How it works: the script downloads llama.cpp from its official releases and the model from IFM on Hugging Face, verifies it, and runs it on your computer">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5F6C64"/></marker>
  </defs>
  <rect width="1200" height="430" rx="24" fill="#FFFFFF" stroke="#D5DCCF" stroke-width="2"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="58" font-size="26" font-weight="800" fill="#1F2A24">How it works</text>
    <text x="48" y="86" font-size="16" fill="#66736B">Nothing is forked or bundled. The script downloads the original files from their official sources.</text>

    <!-- repo -->
    <rect x="48" y="150" width="250" height="190" rx="18" fill="#F7F9F4" stroke="#1F2A24" stroke-width="2.5"/>
    <text x="72" y="186" font-size="13" font-weight="700" letter-spacing="2" fill="#66736B">THIS REPOSITORY</text>
    <text x="72" y="218" font-size="21" font-weight="800" fill="#1F2A24">k2local.py</text>
    <text x="72" y="246" font-size="15" fill="#4A5750">+ SKILL.md instructions</text>
    <text x="72" y="270" font-size="15" fill="#4A5750">+ troubleshooting</text>
    <text x="72" y="312" font-size="15" font-weight="700" fill="#1F2A24">≈ 50 KB, Python only</text>

    <!-- sources -->
    <rect x="430" y="118" width="340" height="104" rx="16" fill="#EEF5FC" stroke="#1C7ED6" stroke-width="2"/>
    <text x="452" y="150" font-size="13" font-weight="700" letter-spacing="2" fill="#1C7ED6">1 · INSTALL</text>
    <text x="452" y="178" font-size="19" font-weight="800" fill="#1F2A24">llama.cpp (build b11619)</text>
    <text x="452" y="203" font-size="14" fill="#4A5750">github.com/ggml-org/llama.cpp releases</text>

    <rect x="430" y="248" width="340" height="120" rx="16" fill="#F1EDFD" stroke="#7048E8" stroke-width="2"/>
    <text x="452" y="280" font-size="13" font-weight="700" letter-spacing="2" fill="#7048E8">2 · DOWNLOAD</text>
    <text x="452" y="308" font-size="19" font-weight="800" fill="#1F2A24">K2 Horizon model (GGUF)</text>
    <text x="452" y="333" font-size="14" fill="#4A5750">huggingface.co/IFM · official files</text>
    <text x="452" y="355" font-size="14" font-weight="700" fill="#2B9348">✓ checksum verified</text>

    <!-- computer -->
    <rect x="902" y="150" width="250" height="190" rx="18" fill="#E7F5EC" stroke="#2B9348" stroke-width="2.5"/>
    <text x="926" y="186" font-size="13" font-weight="700" letter-spacing="2" fill="#2B9348">3 · SERVE</text>
    <text x="926" y="218" font-size="21" font-weight="800" fill="#1F2A24">Your computer</text>
    <text x="926" y="246" font-size="15" fill="#4A5750">model runs locally</text>
    <text x="926" y="270" font-size="15" fill="#4A5750">nothing leaves the device</text>
    <text x="926" y="312" font-size="14" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1F2A24">127.0.0.1:8080/v1</text>

    <!-- arrows -->
    <path d="M298 215 C 360 215, 370 170, 426 170" fill="none" stroke="#5F6C64" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M298 275 C 360 275, 370 308, 426 308" fill="none" stroke="#5F6C64" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M770 170 C 830 170, 845 215, 898 215" fill="none" stroke="#5F6C64" stroke-width="2.5" marker-end="url(#a)"/>
    <path d="M770 308 C 830 308, 845 275, 898 275" fill="none" stroke="#5F6C64" stroke-width="2.5" marker-end="url(#a)"/>
  </g>
</svg>
