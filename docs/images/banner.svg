<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Run K2 Horizon locally: 0.9B, 3.7B and 7B on your own computer">
  <defs>
    <linearGradient id="t" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0CA678"/><stop offset=".5" stop-color="#1C7ED6"/><stop offset="1" stop-color="#7048E8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="#EEF2EA"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="86" font-size="15" font-weight="700" letter-spacing="3" fill="#66736B">K2 HORIZON · LOCAL · PRIVATE · OFFLINE</text>
    <text x="64" y="156" font-size="60" font-weight="800" fill="#1F2A24">Run K2 Horizon</text>
    <text x="64" y="222" font-size="60" font-weight="800" fill="url(#t)">on your own computer</text>
    <text x="64" y="276" font-size="22" fill="#4A5750">One script picks the size that fits, installs it, and tests it.</text>
    <text x="64" y="306" font-size="22" fill="#4A5750">macOS · Linux · Windows</text>
  </g>
  <!-- three device cards -->
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(760,52)">
      <rect width="120" height="236" rx="18" fill="#FFFFFF" stroke="#D5DCCF" stroke-width="2"/>
      <rect x="44" y="28" width="32" height="10" rx="3" fill="#0CA678" opacity=".35"/>
      <rect x="34" y="38" width="52" height="56" rx="16" fill="none" stroke="#0CA678" stroke-width="5"/>
      <rect x="44" y="94" width="32" height="10" rx="3" fill="#0CA678" opacity=".35"/>
      <text x="60" y="150" text-anchor="middle" font-size="30" font-weight="800" fill="#0CA678">0.9B</text>
      <text x="60" y="178" text-anchor="middle" font-size="14" fill="#66736B">watches,</text>
      <text x="60" y="196" text-anchor="middle" font-size="14" fill="#66736B">quick tasks</text>
    </g>
    <g transform="translate(896,52)">
      <rect width="120" height="236" rx="18" fill="#FFFFFF" stroke="#D5DCCF" stroke-width="2"/>
      <rect x="40" y="24" width="40" height="78" rx="9" fill="none" stroke="#1098AD" stroke-width="5"/>
      <circle cx="60" cy="90" r="4" fill="#1098AD"/>
      <text x="60" y="150" text-anchor="middle" font-size="30" font-weight="800" fill="#1098AD">3.7B</text>
      <text x="60" y="178" text-anchor="middle" font-size="14" fill="#66736B">phones,</text>
      <text x="60" y="196" text-anchor="middle" font-size="14" fill="#66736B">everyday use</text>
    </g>
    <g transform="translate(1032,52)">
      <rect width="120" height="236" rx="18" fill="#FFFFFF" stroke="#D5DCCF" stroke-width="2"/>
      <rect x="22" y="36" width="76" height="50" rx="5" fill="none" stroke="#7048E8" stroke-width="5"/>
      <path d="M12 98 H108" stroke="#7048E8" stroke-width="7" stroke-linecap="round"/>
      <text x="60" y="150" text-anchor="middle" font-size="30" font-weight="800" fill="#7048E8">7B</text>
      <text x="60" y="178" text-anchor="middle" font-size="14" fill="#66736B">laptops,</text>
      <text x="60" y="196" text-anchor="middle" font-size="14" fill="#66736B">best quality</text>
    </g>
  </g>
</svg>
